   xml:space="preserve"><tspan
     x="0"
     y="0"
     id="tspan1">&quot;There are strong rumours that the Government are 
</tspan><tspan
     x="0"
     y="41.270375"
     id="tspan2">going to produce their defence investment plan on </tspan><tspan
     x="0"
     y="82.54075"
     id="tspan3">Friday. That would be an utter disgrace and an utter 
</tspan><tspan
