   transform="matrix(1,0,0,-1,53.16,665.57)">           <tspan
   id="tspan186"
   y="0"
   x="0">&quot;This Government claim we had 14 years of errors... but</tspan>           <tspan
   id="tspan198"
   y="43"
   x="0">they had 14 years to plan, two years in government, and</tspan>           <tspan
   id="tspan210"
   y="86"
   x="0">we are nowhere. Defence capability is falling. NATO puts</tspan>           <tspan
   id="tspan222"
   y="129"
   x="0">us at No. 31 out of 32 of those failing to meet targets,&quot;</tspan>           <tspan
   id="tspan234"
   y="172"
   x="0">ahead of only Iceland, which has no military.</tspan>        </text>
