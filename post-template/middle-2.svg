   xml:space="preserve"><tspan
     x="53.16"
     y="-330.85999"
     id="tspan5">&quot;May I offer advice to Defence Ministers in their bare-</tspan><tspan
     x="53.16"
     y="-293.35997"
     id="tspan6">knuckle fight with the Treasury? They really should move </tspan><tspan
     x="53.16"
     y="-255.85997"
     id="tspan7">away from this glib line... do not parrot a line way below </tspan><tspan
     x="53.16"
     y="-218.35997"
     id="tspan8">what we need.&quot;        </tspan></text>
      
    
