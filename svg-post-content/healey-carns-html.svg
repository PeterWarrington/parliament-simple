     y="190.86769">John Healey (Formerly Defence Secretary):</tspan></text><text
   xml:space="preserve"
   style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:36.8595px;line-height:45px;font-family:Helvetica;-inkscape-font-specification:'Helvetica, Bold';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;letter-spacing:0px;word-spacing:1.84px;writing-mode:lr-tb;direction:ltr;fill:#f9f9f9;stroke-width:0.944882;stroke-linejoin:bevel"
