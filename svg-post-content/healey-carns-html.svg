   style="fill:#f9f9f9;stroke-width:1.01185">
        <text
   id="text32"
   style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:30.3309px;font-family:Helvetica;-inkscape-font-specification:'Helvetica, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;white-space:pre;inline-size:842.181;display:inline;fill:#f9f9f9;fill-opacity:1;stroke:none;stroke-width:1.04394"
   transform="matrix(0.88070832,0,0,-0.88070832,61.883526,901.52182)"
   xml:space="preserve"><tspan
     x="0"
     y="28.519739"
     id="tspan2">&quot;Our adversaries do not follow timetables set by the Treasury. I </tspan><tspan
     x="0"
     y="66.433364"
     id="tspan3">appreciate how hard this is for Cabinet colleagues, ... but not </tspan><tspan
     x="0"
     y="104.34699"
     id="tspan4">all needs to be done by cutbacks elsewhere.&quot;        </tspan></text>
      </g><g
   id="g130-3"
   transform="matrix(1.209293,0,0,-1.209293,136.41609,58.949774)"
   style="fill:#f9f9f9;stroke-width:1.10257">
      <text
   id="text140-4"
   style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:41.4803px;line-height:39.4071px;font-family:Arial;-inkscape-font-specification:'Arial, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;fill:#f9f9f9;fill-opacity:1;stroke:none;stroke-width:1.10256"
   transform="scale(1,-1)"
   x="-100.68644"
   y="23.769812"><tspan
     x="-100.68644"
     y="23.769812"
     style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:41.4803px;line-height:39.4071px;font-family:Helvetica;-inkscape-font-specification:'Helvetica, Bold';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;fill:#f9f9f9;stroke-width:1.10256"
     id="tspan13">Defence Resignation Statements Today</tspan></text>
      
    
    </g><g
   id="g166"
   transform="matrix(1.3333333,0,0,-1.3333333,-14.825945,202.56263)"
   style="fill:#f9f9f9">
      <g
   clip-path="url(#clipPath172)"
   id="g168"
   style="fill:#f9f9f9">
        <path
   id="path174"
   style="fill:#f9f9f9;stroke:#ffffff;stroke-width:6;stroke-linecap:butt;stroke-linejoin:round;stroke-miterlimit:10;stroke-dasharray:18, 6;stroke-dashoffset:0;stroke-opacity:1"
   d="M 867.48,58.68 H 16.68" />
      </g>
    </g><text
   id="text188"
   style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:30px;font-family:Helvetica;-inkscape-font-specification:'Helvetica, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;white-space:pre;inline-size:841.504;display:inline;fill:#f9f9f9;fill-opacity:1;stroke:none;stroke-width:1.11559"
   transform="matrix(1.1464991,0,0,1.1464991,17.070202,359.16393)"
   xml:space="preserve"><tspan
     x="0"
     y="28.208599"
     id="tspan5">&quot;From Energy to Transport to Health, security must run through </tspan><tspan
     x="0"
     y="65.708599"
     id="tspan6">the Government like letters through a stick of rock. Security </tspan><tspan
     x="0"
     y="103.2086"
     id="tspan7">must be felt in communities right across Britain, reversing long-</tspan><tspan
     x="0"
     y="140.7086"
     id="tspan8">term decline and bringing new jobs and new hope.&quot;</tspan></text><text
   id="text188-3"
   style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:30px;font-family:Helvetica;-inkscape-font-specification:'Helvetica, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;white-space:pre;inline-size:841.504;display:inline;fill:#f9f9f9;fill-opacity:1;stroke:none;stroke-width:1.11559"
   transform="matrix(1.1464991,0,0,1.1464991,25.327027,605.51096)"
   xml:space="preserve"><tspan
     x="0"
     y="28.208599"
     id="tspan9">&quot;The character of warfare is changing at exceptional speed. In </tspan><tspan
     x="0"
     y="65.708599"
     id="tspan10">Ukraine, a navy without a ship has destroyed a navy. A drone </tspan><tspan
     x="0"
     y="103.2086"
     id="tspan12">costing thousands can destroy a tank costing millions. A drone </tspan><tspan
     x="0"
     y="140.7086"
     id="tspan14">can now strike 2,000 km into Russia at a fraction of the cost of </tspan><tspan
     x="0"
     y="178.2086"
     id="tspan15">a fighter jet.&quot;</tspan></text><text
   id="text188-3-9"
   style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:30px;font-family:Helvetica;-inkscape-font-specification:'Helvetica, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;white-space:pre;inline-size:855.287;display:inline;fill:#f9f9f9;fill-opacity:1;stroke:none;stroke-width:1.11559"
   transform="matrix(1.1464991,0,0,1.1464991,23.639964,848.11873)"
   xml:space="preserve"><tspan
     x="0"
     y="28.208599"
     id="tspan16">&quot;National security and economic security are not competing </tspan><tspan
     x="0"
     y="65.708599"
     id="tspan17">priorities; they are the same priority. A country that cannot </tspan><tspan
     x="0"
     y="103.2086"
     id="tspan18">defend itself will not stay prosperous for long. Put simply, a </tspan><tspan
     x="0"
     y="140.7086"
     id="tspan21">country that cannot defend itself will struggle to protect its </tspan><tspan
     x="0"
     y="178.2086"
     id="tspan22">prosperity.&quot;</tspan></text><text
   id="text188-3-9-4"
   style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:30px;font-family:Helvetica;-inkscape-font-specification:'Helvetica, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;white-space:pre;inline-size:820.829;display:inline;fill:#f9f9f9;fill-opacity:1;stroke:none;stroke-width:1.11559"
   transform="matrix(1.1464991,0,0,1.1464991,21.617792,1080.3854)"
   xml:space="preserve"><tspan
     x="0"
     y="28.208599"
     id="tspan23">&quot;In 2026, security means more than military strength alone. It </tspan><tspan
     x="0"
     y="65.708599"
     id="tspan24">means secure borders, secure energy, secure jobs and </tspan><tspan
     x="0"
     y="103.2086"
     id="tspan25">secure communities.&quot;</tspan></text><text
   id="text188-3-9-4-0"
   style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:30px;font-family:Helvetica;-inkscape-font-specification:'Helvetica, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;white-space:pre;inline-size:841.504;display:inline;fill:#f9f9f9;fill-opacity:1;stroke:none;stroke-width:1.11559"
   transform="matrix(1.1464991,0,0,1.1464991,20.84591,1229.0994)"
   xml:space="preserve"><tspan
     x="0"
     y="28.208599"
     id="tspan26">&quot;In 1945, Britain was exhausted and in debt. Our cities had </tspan><tspan
     x="0"
     y="65.708599"
     id="tspan27">been bombed, and rationing went on for years. Yet Attlee’s </tspan><tspan
     x="0"
     y="103.2086"
     id="tspan28">Government did not conclude that Britain could afford only one </tspan><tspan
     x="0"
     y="140.7086"
     id="tspan29">priority.&quot;</tspan></text><text
   id="text188-3-9-4-0-8"
   style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:30px;font-family:Helvetica;-inkscape-font-specification:'Helvetica, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;white-space:pre;inline-size:855.287;display:inline;fill:#f9f9f9;fill-opacity:1;stroke:none;stroke-width:1.11559"
   transform="matrix(1.1464991,0,0,1.1464991,16.161892,1419.4254)"
   xml:space="preserve"><tspan
     x="0"
     y="28.208599"
     id="tspan30">&quot;I believe that we can once again build a country that provides </tspan><tspan
     x="0"
     y="65.708599"
     id="tspan31">security in the broadest sense of the word—security for our </tspan><tspan
     x="0"
     y="103.2086"
     id="tspan32">nation, communities, working families and the next generation. </tspan><tspan
     x="0"
     y="140.7086"
     id="tspan33">That is the debate that I am confident my resignation has </tspan><tspan
     x="0"
     y="178.2086"
     id="tspan34">started.&quot;</tspan></text>
      
    
